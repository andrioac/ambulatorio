; Otimizações seguras para o ambiente local de desenvolvimento.
; Mantém o bytecode em memória, mas verifica alterações a cada requisição.
opcache.enable=1
opcache.enable_cli=1
opcache.validate_timestamps=1
opcache.revalidate_freq=0
opcache.file_update_protection=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; Reduz chamadas repetidas ao sistema de arquivos durante o bootstrap do Laravel.
realpath_cache_size=4096K
realpath_cache_ttl=600
