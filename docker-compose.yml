services:
  app:
    build: .
    container_name: ambulatorio-app
    ports:
      - "8082:80"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    container_name: ambulatorio-postgres
    environment:
      POSTGRES_DB: ambulatorio
      POSTGRES_USER: ambulatorio
      POSTGRES_PASSWORD: ambulatorio
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ambulatorio -d ambulatorio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
